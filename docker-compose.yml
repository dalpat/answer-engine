# Self-hosted, local. Two services: the app + SearXNG. See docs/spec.html §11.
#   docker compose up   →   http://localhost:3000
services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=file:/data/app.db # swap to postgres://… later
      - SEARXNG_URL=http://searxng:8080
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
      - ORIGIN=${ORIGIN:-http://localhost:3000} # must match the URL users hit (CSRF)
    volumes:
      - ./data:/data
    depends_on:
      - searxng

  searxng:
    image: searxng/searxng:latest
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    volumes:
      - ./searxng:/etc/searxng
    # Not published to the host by default — only the app talks to it.
